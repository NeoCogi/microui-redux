[package]
name = "microui-redux"
authors = ["Raja Lehtihet", "Wael El Oraiby"]
version = "0.8.0-pre-alpha"
edition = "2024"
readme = "README.md"
license = "BSD-3-Clause AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
description = "Retained Rust MicroUI-inspired GUI library"
repository = "https://github.com/NeoCogi/microui-redux"
autoexamples = false
categories = ["gui", "rendering"]
exclude = ["atlas.png", ".codex", ".codex/**"]

[lib]
name = "microui_redux"

[features]
default = ["builder", "save-to-rust"]
builder = ["dep:fontdue", "dep:png"]
png_source = ["dep:png"]
save-to-rust = []
prebuilt-atlas = ["png_source"]
external-atlas = ["png_source"]
example-backend = []
# Example backends are only used by examples and are wired to optional deps. They remain additive:
# examples select Glow, then Vulkan, then WGPU when more than one is enabled.
example-glow = ["example-backend", "dep:sdl2", "dep:glow"]
example-vulkan = [
    "example-backend",
    "dep:sdl2",
    "dep:ash",
    "dep:ash-window-handle",
    "dep:raw-window-handle",
]
example-wgpu = [
    "example-backend",
    "dep:sdl2",
    "dep:wgpu",
    "dep:pollster",
    "dep:raw-window-handle",
]

[dependencies]
fontdue = { version = "0.9.2", optional = true }
bitflags = "2.4.1"
rs-math3d = "0.12"
png = { version = "0.18", optional = true }
sdl2 = { version = "0.38", features = ["raw-window-handle"], optional = true }
glow = { version = "0.17", optional = true }
ash = { version = "0.38", default-features = false, features = [
    "linked",
], optional = true }
ash-window-handle = { package = "ash-window", version = "0.13", optional = true }
raw-window-handle = { version = "0.6", optional = true }
wgpu = { version = "28", optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
rand = "0.10"

[[bin]]
name = "atlas_export"
path = "tools/atlas_export.rs"
required-features = ["builder", "save-to-rust", "png_source"]

# Examples listed explicitly to ensure shared assets compile across feature sets.
[[example]]
name = "simple"
path = "examples/simple.rs"
required-features = ["example-backend"]

[[example]]
name = "demo-full"
path = "examples/demo-full.rs"
required-features = ["example-backend"]

[[example]]
name = "backend-frame-cube"
path = "examples/backend-frame-cube.rs"
required-features = ["example-backend"]

[[example]]
name = "calculator"
path = "examples/calculator.rs"
required-features = ["example-backend"]

[[example]]
name = "texture-clipping-smoke"
path = "examples/texture-clipping-smoke.rs"

[[example]]
name = "retained-custom-drawing"
path = "examples/retained-custom-drawing.rs"

# small size executable
[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

# Profile used only by the dedicated min-size platform target. The alias overrides panic to the
# nightly-only immediate-abort strategy while rebuilding std with the same size-oriented profile.
[profile.min-size]
inherits = "release"
incremental = false
