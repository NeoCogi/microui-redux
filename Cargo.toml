[workspace]
resolver = "3"
members = [
    "crates/microui-redux",
    "crates/renderer-common",
    "crates/renderer-glow",
    "crates/renderer-vulkan",
    "crates/renderer-wgpu",
    "demos/demo-assets",
    "demos/demo-host",
    "demos/demo-full",
    "demos/basic",
    "tools/xtask",
]
default-members = ["crates/microui-redux"]

[workspace.package]
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
license = "BSD-3-Clause AND MIT AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
readme = "README.md"
repository = "https://github.com/NeoCogi/microui-redux"

[workspace.dependencies]
microui-redux = { path = "crates/microui-redux", version = "0.8.0", default-features = false }
microui-redux-demo-assets = { path = "demos/demo-assets", default-features = false }
microui-redux-demo-host = { path = "demos/demo-host", default-features = false }
microui-redux-renderer-common = { path = "crates/renderer-common" }
microui-redux-renderer-glow = { path = "crates/renderer-glow" }
microui-redux-renderer-vulkan = { path = "crates/renderer-vulkan" }
microui-redux-renderer-wgpu = { path = "crates/renderer-wgpu" }

ash = { version = "0.38", default-features = false, features = ["linked"] }
ash-window-handle = { package = "ash-window", version = "0.13" }
bitflags = "2.4.1"
fontdue = "0.9.2"
glow = "0.18"
png = "0.18"
pollster = "1"
rand = "0.10"
raw-window-handle = "0.6"
rs-math3d = "0.13"
sdl2 = { version = "0.38", features = ["raw-window-handle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
trybuild = "1.0"
wgpu = "30"

[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

[profile.min-size]
inherits = "release"
incremental = false
